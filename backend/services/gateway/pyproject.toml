[project]
name = "finpilot-gateway"
version = "0.1.0"
description = "FinPilot API Gateway — the single front door: verifies JWTs, injects identity, routes to services"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.0",
  "httpx==0.28.1",
  "pydantic==2.11.3",
  "pydantic-settings==2.8.1",
  "redis==5.2.1",
  "finpilot-shared",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
