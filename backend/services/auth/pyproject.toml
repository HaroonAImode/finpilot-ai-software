[project]
name = "finpilot-auth"
version = "0.1.0"
description = "FinPilot Auth Service — signup, login, JWT issuance, refresh tokens"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy==2.0.40",
  "asyncpg==0.30.0",
  "alembic==1.15.2",
  "pydantic==2.11.3",
  "pydantic-settings==2.8.1",
  "argon2-cffi==23.1.0",
  "pyjwt==2.10.1",
  "email-validator==2.2.0",
  "redis==5.2.1",
  "finpilot-shared",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
  "httpx==0.28.1",
  "aiosqlite==0.21.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
finpilot-shared = { path = "../../libs/shared" }
