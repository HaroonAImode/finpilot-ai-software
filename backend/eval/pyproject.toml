[project]
name = "finpilot-golden-eval"
version = "0.1.0"
description = "Golden Dataset evaluation/benchmark harness for the June 2026 petty-cash dataset — a QA tool, never a production dependency. See README.md and docs/invoice-ocr-plan.md §15."
requires-python = ">=3.11,<3.14"
# httpx: talks to the running ai-engine's real /ocr/extract endpoint, the
# same path a real upload takes — same dependency ai-engine itself uses.
# openpyxl: reads June Cash book..xlsx for the ground-truth cross-check.
dependencies = ["httpx", "openpyxl"]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["golden_eval*"]
